<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar with Playlists -->
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-headphones"></i>
                <span>MusicPlayer</span>
            </div>
            
            <!-- Playlists Section -->
            <div class="playlists-sidebar">
                <h3>Your Playlists</h3>
                <ul id="playlistList">
                    <li class="playlist-item active" data-playlist="all">
                        <i class="fas fa-music"></i> All Songs
                    </li>
                    
                    <li class="playlist-item" data-playlist="recent">
                        <i class="fas fa-clock"></i> Recently Played
                        <button class="clear-recent" id="clearRecentBtn" title="Clear recent songs">✕</button>
                    </li>
                </ul>
            </div>
            
           
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <header>
                <h1>My <span class="gradient-text">Music</span></h1>
                <div class="song-count" id="songCount">9 songs</div>
            </header>

             <!-- Search Box -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search songs...">
            </div>
            <br>
            
            <!-- Songs List -->
            <section class="songs-section">
                <div class="songs-list" id="songsList">
                    <!-- Dynamic via JS -->
                </div>
            </section>
        </div>
    </div>

    <!-- Music Player Bar (Hidden by default) -->
    <div class="music-player-bar hidden" id="musicPlayer">
        <div class="now-playing">
            <img id="currentCover" src="images/default.jpg" alt="cover">
            <div class="song-info">
                <h4 id="currentTitle">Select a song</h4>
                <p id="currentArtist">-</p>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <i class="fas fa-random" id="shuffleBtn"></i>
                <i class="fas fa-step-backward" id="prevBtn"></i>
                <i class="fas fa-play-circle" id="playPauseBtn"></i>
                <i class="fas fa-step-forward" id="nextBtn"></i>
                <i class="fas fa-repeat" id="repeatBtn"></i>
            </div>
            
            <div class="progress-area">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
        
        <div class="volume-controls">
            <i class="fas fa-volume-up" id="volumeIcon"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer" style="display: none;"></audio>
    
    <script src="script.js"></script>
</body>
</html>
